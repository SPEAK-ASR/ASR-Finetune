compute_environment: LOCAL_MACHINE
distributed_type: NO

# Single AMD MI300X GPU
num_machines: 1
num_processes: 1
gpu_ids: all
machine_rank: 0

# bf16 mixed precision (MI300X supports bfloat16)
mixed_precision: bf16
downcast_bf16: "no"

main_training_function: main

use_cpu: false
tpu_use_cluster: false
tpu_use_sudo: false
tpu_env: []
